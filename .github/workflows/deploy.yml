name: Deploy (Cloudflare Workers)

# main → production（foodluck.com.tw / www）；手動觸發可選 test（www-test.foodluck.com.tw）
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "wrangler environment"
        type: choice
        options: [production, test]
        default: test

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check worker
        run: npm run check:worker

      - name: Build static export
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ github.event.inputs.environment || 'production' }}
